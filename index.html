<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard de Futebol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a3b42;--mut:#7b7872;--red:#a63a4e;--navy:#234a8a;--teal:#2f7f86;--ochre:#c9a04a;--plum:#7a5c8c;--moss:#5f8a5a;--dot:#bdb8b0;
--hd:'Playfair Display',Georgia,'Times New Roman',serif;--cd:'Oswald','Arial Narrow',Impact,sans-serif;--sn:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#e8e5e0}
body{font-family:var(--sn);color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
background:radial-gradient(ellipse 52% 62% at 52% 58%,#f8f7f4 0%,#efede9 55%,#e8e5e0 100%)}
#stage>*{position:absolute}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
#fans{left:0;top:0;z-index:1}
.dt{fill:var(--dot)}
.dt.off{opacity:.2}
.dt.r1{fill:var(--red)}.dt.r2{fill:var(--navy)}
.ex1{fill:none;stroke:var(--red);stroke-width:1.1}
.ex2{fill:none;stroke:var(--navy);stroke-width:1.1}
.cb{}
.cb.off{opacity:.28}
.cbt{font:700 5px var(--sn);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
@keyframes pop{from{opacity:0;transform:scale(.1)}}
#tt{left:28px;top:12px;width:470px;z-index:4}
#tt .kk{display:flex;align-items:center;gap:8px;font:700 10px var(--sn);letter-spacing:2.6px;color:var(--mut);text-transform:uppercase;height:34px}
.slot{position:relative;overflow:hidden;cursor:default;flex:none}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.slot.has img{display:block}.slot.has>svg{display:none}
#emb{width:34px;height:34px;border-radius:10px;background:linear-gradient(90deg,#234a8a 50%,#a63a4e 50%);box-shadow:0 3px 8px rgba(40,40,60,.28);display:grid;place-items:center}
#emb svg{width:22px;height:22px}
#tt h1{font:900 53px/1 var(--hd);letter-spacing:7px;color:#5b5a60;margin-top:2px;text-shadow:0 2px 0 rgba(255,255,255,.7);white-space:nowrap}
#tt h2{font:600 19px/1.12 var(--cd);letter-spacing:1px;color:var(--red);margin-top:7px;text-transform:uppercase;width:430px}
#tt .ld{font:700 9.6px/1.38 var(--sn);color:var(--red);margin-top:8px;width:392px}
#tt .ld b{font-weight:800;color:#8c2a3d}
#tt .by{font:600 8.6px var(--sn);color:var(--mut);margin-top:3px}
/* filters */
#flt{left:500px;top:10px;width:326px;height:96px;border-radius:16px;background:rgba(255,255,255,.88);box-shadow:0 4px 14px rgba(60,60,70,.14);padding:8px 10px;z-index:5;display:flex;flex-direction:column;gap:5px}
.fr{display:flex;gap:3px;align-items:center}
.fl{font:800 7px var(--sn);letter-spacing:.9px;color:var(--mut);width:40px;text-transform:uppercase;flex:none}
.pl{height:19px;border-radius:10px;background:#efece7;font:700 8.2px var(--sn);color:#5a574f;text-align:center;line-height:19px;flex:1 1 0;min-width:0;white-space:nowrap}
.pl:hover{background:#e2ddd5}
.pl.on{background:var(--red);color:#fff;box-shadow:0 2px 6px rgba(166,58,78,.4)}
.pl.cp.on{background:var(--navy);box-shadow:0 2px 6px rgba(35,74,138,.4)}
.pl.se.on{background:#3a3b42;box-shadow:0 2px 6px rgba(40,40,50,.35)}
#me{left:842px;top:10px;width:204px;height:46px;border-radius:26px;background:rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(60,60,70,.14);display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;z-index:5}
#me img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--ochre);flex:none}
#me .nm{font:800 12.4px var(--sn);color:var(--ink);line-height:1.1}
#me a.em{font:600 8.8px var(--sn);color:var(--mut);text-decoration:none;display:block;margin-top:1px;white-space:nowrap}
#langs{left:1054px;top:17px;display:flex;gap:3px;z-index:5}
#langs button{width:28px;height:32px;border-radius:9px;background:rgba(255,255,255,.9);font:800 9.4px var(--sn);color:#5a574f;box-shadow:0 2px 6px rgba(60,60,70,.14);transition:.15s}
#langs button.on{background:var(--navy);color:#fff}
.rb{top:17px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 6px rgba(60,60,70,.14);display:grid;place-items:center;z-index:5}
.rb svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s}
#rf{left:1186px}#tb{left:1224px;background:#2f6b4f}#tb svg{stroke:#fff}
#rf:hover svg{transform:rotate(180deg)}
#lks{left:910px;top:62px;width:322px;display:flex;gap:6px;justify-content:flex-end;z-index:5}
#lks a{display:flex;align-items:center;gap:6px;height:25px;padding:0 11px 0 5px;border-radius:13px;background:#fff;border:1px solid rgba(60,50,40,.16);font:800 10px var(--sn);color:var(--ink);text-decoration:none;box-shadow:0 2px 7px rgba(60,60,70,.16);transition:.15s;white-space:nowrap}
#lks a svg{width:16px;height:16px;flex:none}
#lks a:hover{transform:translateY(-1px);border-color:var(--navy);box-shadow:0 5px 12px rgba(60,60,70,.26)}
/* mini chart */
#mc{left:524px;top:112px;width:264px;height:170px;z-index:4}
#mc h4{font:600 11px var(--cd);letter-spacing:.8px;color:var(--ink);text-transform:uppercase;display:flex;gap:6px;align-items:center;white-space:nowrap}
#mc h4 i{font-style:normal;color:var(--red)}
#mc h4 button{margin-left:auto;font:800 7.6px var(--sn);color:var(--red);text-transform:none;letter-spacing:0;display:none}#mc h4 button.show{display:block}
#chips em{font:700 6.8px var(--sn);font-style:normal;color:var(--mut);margin-left:auto;display:flex;gap:5px;white-space:nowrap}#chips em s{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:2px}
#mc h4 em{font:700 7px var(--sn);font-style:normal;letter-spacing:.4px;color:var(--mut);margin-left:auto;display:flex;gap:6px;text-transform:none}
#mc h4 em s{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:2px;vertical-align:-0.5px}
#mc svg{display:block;margin-top:0}
#chips{display:flex;gap:4px;margin-top:1px;align-items:center}
#chips span{font:800 7.8px var(--sn);background:#fff;border-radius:9px;padding:1px 5px;box-shadow:0 1px 3px rgba(60,60,70,.18);color:var(--ink)}
#chips span i{font-style:normal;color:var(--mut);margin-right:2px;font-weight:700}
.big{width:128px;height:128px;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(60,60,70,.2),inset 0 0 0 5px #f3f1ed;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;text-align:center}
.big b{font:700 54px/.95 var(--cd);letter-spacing:-.5px}
.big i{font:600 15px/1 var(--cd);font-style:normal;letter-spacing:2px;color:#6b6861;margin-top:2px}
.big u{text-decoration:none;font:700 6.5px var(--sn);letter-spacing:1.3px;color:var(--mut);margin-top:3px;text-transform:uppercase}
#b1{left:86px;top:391px}#b1 b{color:var(--red)}
#b2{left:1086px;top:296px}#b2 b{color:var(--navy);font-size:58px}
.lg{z-index:4;font:700 7.4px var(--sn);letter-spacing:1px;color:var(--mut);display:flex;flex-direction:column;gap:3px;text-transform:uppercase}
.lg span{display:flex;align-items:center;gap:5px}
.lg s{width:7px;height:7px;border-radius:50%;display:inline-block}
.lg s.o{background:none;border:1.3px solid var(--red)}
#hero{left:392px;top:300px;width:566px;height:420px;z-index:2;cursor:default}
#hero img{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:none}
#hero.has img{display:block}#hero.has>svg,#hero.has .hh{display:none}
#hero>svg{position:absolute;inset:0;width:100%;height:100%}
#hero .hh{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);font:700 8.2px var(--sn);letter-spacing:1.2px;color:#8a867e;background:rgba(255,255,255,.85);padding:4px 10px;border-radius:10px;text-transform:uppercase;white-space:nowrap}
.bd{border-radius:50%;background:#fff;border:3.5px solid var(--c);box-shadow:0 0 0 2.5px #fff,0 5px 12px rgba(60,60,70,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6;text-align:center;line-height:1}
.bd b{font:700 var(--fs,21px)/1 var(--cd);color:var(--ink)}
.bd i{font:700 6.4px/1.1 var(--sn);font-style:normal;color:var(--mut);margin-top:2px;max-width:86%}
.tx{z-index:4}
.tx h3{font:600 13.6px/1.1 var(--cd);letter-spacing:.4px;color:var(--red)}
.tx p{font:600 8.4px/1.38 var(--sn);color:#55524b;margin-top:3px}
.tx p b{color:var(--ink);font-weight:800}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#ddd;margin-top:3px}
.bar span{display:block;height:100%}
.bl{display:flex;justify-content:space-between;font:800 8px var(--sn);margin-top:1px;height:10px}
.cap{font:700 6.2px var(--sn);letter-spacing:1px;color:var(--mut);text-transform:uppercase}
#sr{left:792px;top:104px;width:134px}
#sl{left:24px;top:524px;width:172px}#sl h3{font-size:12px}#sl p{font-size:8px;line-height:1.3}#sl h3,#sl p{width:236px}
#ph{left:402px;top:238px;width:112px;z-index:4}
#ph h3{font:600 13px/1.1 var(--cd);color:var(--ink)}
#ph p{font:600 7.4px/1.32 var(--sn);color:var(--mut);margin-top:2px}
.av{display:flex;align-items:center;gap:5px;margin-top:6px}
.av .slot{width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:#fff}
.av .slot svg{width:100%;height:100%}
.av b{font:700 15px/1 var(--cd);color:var(--ink);display:block}
.av i{font:600 7px var(--sn);font-style:normal;color:var(--mut);display:block}
.cur{margin-top:7px;padding-top:6px;border-top:1.5px dashed #c8c3bb;display:flex;align-items:center;gap:6px}
.cur .big2{font:700 22px/1 var(--cd);color:var(--red)}
.cur i{font:700 7.2px/1.2 var(--sn);font-style:normal;color:var(--ink);display:block}
#rk{left:826px;top:578px;width:430px;z-index:4}
#rk h3{font:600 13.4px/1.1 var(--cd);color:var(--ink)}
#rk h3 span{color:var(--navy)}
#rk p{font:600 8.4px/1.35 var(--sn);color:#55524b;margin-top:2px;width:400px}
.rw{display:flex;align-items:flex-end;margin-top:3px;position:relative}
.rw .it{width:68px;text-align:center;flex:none}
.rw .it b{font:700 13px/1 var(--cd);display:block;color:var(--ink)}
.rw .it em{font:600 6.6px var(--sn);font-style:normal;color:var(--mut);display:block}
.rw .it .slot{width:32px;height:32px;border-radius:50%;margin:2px auto;border:2.2px solid var(--c);background:#fff}
.rw .it .slot svg{width:100%;height:100%}
.rw .it span{font:800 8.2px/1.1 var(--sn);display:block;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px #fff,0 0 5px #fff}
.rw .cu{width:84px;text-align:center}
.rw .cu .slot{width:40px;height:40px;border-radius:50%;margin:2px auto;border:2.6px solid var(--navy)}
.arr{width:34px;height:30px;flex:none;align-self:center;margin-bottom:12px}
/* Excel sheet */
#tbl{position:fixed;inset:0;background:rgba(40,40,48,.5);display:none;place-items:center;z-index:50}
#tbl.on{display:grid}
#sheet{width:min(1000px,95vw);max-height:88vh;background:#fff;border-radius:10px;box-shadow:0 18px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;font:12px var(--sn);color:#222}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#2f6b4f;color:#fff}
#sheet .tp b{font:700 14px var(--sn);flex:1}
#sheet .tp button{background:rgba(255,255,255,.18);color:#fff;font:700 11.5px var(--sn);padding:5px 12px;border-radius:6px}
#sheet .tp button:hover{background:rgba(255,255,255,.3)}
#sheet .fx{padding:5px 14px;background:#f3f3f3;border-bottom:1px solid #d6d6d6;font:600 11.5px var(--sn);color:#555;display:flex;gap:6px;flex-wrap:wrap}
#sheet .fx span{background:#fff;border:1px solid #d0d0d0;border-radius:4px;padding:1px 8px}
#sheet .sc{overflow:auto;flex:1}
#sheet table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
#sheet th,#sheet td{border:1px solid #dcdcdc;padding:3px 9px;white-space:nowrap}
#sheet tr.ab th{background:#e9e9e9;font-weight:600;color:#777;font-size:10.5px;text-align:center;padding:1px}
#sheet tr.hd th{background:#f2f2f2;position:sticky;top:0;cursor:pointer;text-align:left;font-weight:700}
#sheet tr.hd th:hover{background:#e6efe9}
#sheet td.rn{background:#f2f2f2;color:#777;text-align:center;width:36px}
#sheet td.n{text-align:right}
#sheet tbody tr:hover td{background:#eef6f1}
#sheet tr.w td.res{color:#2a7a4b;font-weight:700}#sheet tr.l td.res{color:#b03a48;font-weight:700}#sheet tr.d td.res{color:#8a7a2a;font-weight:700}
#sheet tfoot td{background:#eaf2ed;font-weight:800;position:sticky;bottom:0}
</style>
</head>

ld:(J,GF,V,E,D,GA,n,g)=>`En <b>${J}</b> partidos, el equipo marcó <b>${GF}</b> goles (${V}G ${E}E ${D}P) y encajó ${GA}. ${n} lidera a los goleadores con <b>${g}</b>.`,
tT:'Tabla de partidos',tX:'Exportar CSV',tC:'Cerrar',tot:'Total / media',tf:'Filtros',tn:'partidos',clr:'× borrar filtros',
cols:['Temp.','Comp.','Mes','Rival','L/V','GF','GC','Res.','Remates','Pos. %','Asist.']}
};
/* ===== state ===== */
let lang='pt',season=2025,comp='all',mon=-1,seed=(Date.now()%100000)+1,DB=[],V=null,sortK=null,sortD=1;
const SEASONS=[2023,2024,2025],COMPS=['all','liga','ucl','copa'];
const sLab=s=>String(s%100).padStart(2,'0')+'/'+String((s+1)%100).padStart(2,'0');
const OPP=['ALM','BIL','CEL','ESP','GET','GIR','LEG','MAL','OSA','RAY','SEV','VAL','VIL','BET','ALA','VLL','LPA','COR','CAD'];
const UOPP=['MUN','LIS','TUR','MIL','PAR','MUC','AMS','POR','BRU','GLA','NAP','DOR','ZAG','ROT'];
const COPP=['CUE','LUG','ALC','TER','SAB','BAD'];
const PL=[['R. Dantas',5],['L. Serrano',4],['M. Oliveira',3.5],['D. Costa',2.5],['T. Ferrer',2],['J. Navarro',1.6],['P. Vidal',1.2],['A. Ibarra',1],['C. Moreno',.8],['E. Salas',.6]];
const PAL=['#a63a4e','#234a8a','#2f7f86','#c9a04a','#7a5c8c','#5f8a5a'];
/* ===== data (seeded, like an Excel table) ===== */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildDB(){
 const rnd=mulberry(seed),rr=(a,b)=>a+rnd()*(b-a);
 const pois=l=>{const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rnd()}while(p>L);return k-1};
 DB=[];
 for(let s=2019;s<=2025;s++){
  const str=rr(.88,1.22),def=rr(.85,1.2),w=PL.map(p=>p[1]*rr(.6,1.5)),W=w.reduce((a,b)=>a+b,0);
  const pick=()=>{let x=rnd()*W;for(let i=0;i<w.length;i++){x-=w[i];if(x<=0)return i}return 0};
  const add=(c,rd,m,opp,home)=>{
   const gf=pois((c==='liga'?2.25:c==='ucl'?2.0:2.4)*str),ga=pois(.95/def*(c==='ucl'?1.1:1)),sh=Math.min(26,gf+Math.round(rr(5,14)));
   const goals=[];
   for(let g=0;g<gf;g++){const q=rnd(),p=pick();let a=rnd()<.72?pick():-1;if(a===p)a=-1;goals.push({p,a,part:q<.6?'L':q<.88?'R':'H',pen:rnd()<.08})}
   DB.push({s,c,rd,m,opp,home,gf,ga,sh,poss:Math.round(rr(48,70)),goals,id:DB.length});
  };
  for(let r=1;r<=38;r++)add('liga',r,Math.floor((r-1)*10/38),OPP[(r-1)%19],r<=19);
  const UM=[1,1,2,3,4,5,6,7,7,8,8,9,9,9];UM.forEach((m,i)=>add('ucl',i+1,m,UOPP[i],i%2===0));
  [4,5,6,7,8,9].forEach((m,i)=>add('copa',i+1,m,COPP[i],i%2===0));
 }
}
const sel=(r,s=season)=>r.s===s&&(comp==='all'||r.c===comp)&&(mon<0||r.m===mon);
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
function compute(){
 const rows=DB.filter(r=>sel(r));
 const GF=sum(rows,r=>r.gf),GA=sum(rows,r=>r.ga),VV=rows.filter(r=>r.gf>r.ga).length,EE=rows.filter(r=>r.gf===r.ga).length,DD=rows.filter(r=>r.gf<r.ga).length;
 const part=(a)=>{const o={l:0,r:0,h:0};a.forEach(m=>m.goals.forEach(g=>{o[g.part==='L'?'l':g.part==='R'?'r':'h']++}));return o};
 const A=rows.filter(r=>r.c!=='liga'),B=rows.filter(r=>r.c==='liga');
 const pg=Array(PL.length).fill(0);rows.forEach(m=>m.goals.forEach(g=>pg[g.p]++));
 const top=pg.map((v,i)=>[i,v]).sort((a,b)=>b[1]-a[1]).slice(0,4);
 const prev=[4,3,2,1].map(k=>({s:season-k,v:sum(DB.filter(r=>sel(r,season-k)),r=>r.gf)}));
 const pm=Math.max(...prev.map(p=>p.v));
 const fanOf=(list)=>list.map(r=>({r,on:sel(r)}));
 const left=fanOf(DB.filter(r=>r.s===season&&r.c==='ucl').concat(DB.filter(r=>r.s===season&&r.c==='copa')));
 const right=fanOf(DB.filter(r=>r.s===season&&r.c==='liga'));
 const monthly=Array.from({length:10},(_,m)=>{const q=DB.filter(r=>r.s===season&&(comp==='all'||r.c===comp)&&r.m===m);return{f:sum(q,r=>r.gf),a:sum(q,r=>r.ga)}});
 return{rows,GF,GA,VV,EE,DD,sA:part(A),sB:part(B),gA:sum(A,r=>r.gf),gB:sum(B,r=>r.gf),top,pg,prev,pm,left,right,monthly,
  ast:sum(rows,r=>r.goals.filter(g=>g.a>=0).length),pens:sum(rows,r=>r.goals.filter(g=>g.pen).length),
  sh:sum(rows,r=>r.sh),poss:rows.length?Math.round(sum(rows,r=>r.poss)/rows.length):0,cs:rows.filter(r=>r.ga===0).length};
}
/* ===== fans ===== */
function lcg(n){return mulberry(n)}
function fan(sp,cx,cy,r0,r1,a0,a1,cls,ringCls,off,tag,rd){
 const MAX=Math.max(...sp.map(k=>Math.min(k.r.sh,22))),step=(r1-r0-14)/(MAX-1),n=sp.length;let s='';
 sp.forEach((k,i)=>{
  const a=(a0+(a1-a0)*(i+.5)/n)*Math.PI/180,c=Math.cos(a),sn=Math.sin(a),L=Math.min(k.r.sh,22),off0=k.on?'':' off';
  const rg=lcg(seed+k.r.s*977+k.r.id*13),idx=[...Array(L).keys()].sort(()=>rg()-.5),reds=new Set(idx.slice(0,k.r.gf));
  const ex=k.r.gf>=3?idx[0]:-1;
  for(let j=0;j<L;j++){
   const rr=r0+9+j*step,x=(cx+rr*c).toFixed(1),y=(cy+rr*sn).toFixed(1),red=k.on&&reds.has(j);
   s+=`<circle class="dt${red?' '+cls:''}${off0}" cx="${x}" cy="${y}" r="${red?rd+.55:rd}"/>`;
   if(red&&ex===j)s+=`<circle class="${ringCls}" cx="${x}" cy="${y}" r="4.4"/>`;
  }
  const rb=r1+12,bx=(cx+rb*c).toFixed(1),by=(cy+rb*sn).toFixed(1),m=k.r;
  s+=`<g><circle class="cb${off0}" cx="${bx}" cy="${by}" r="${tag}" fill="${PAL[(i+off)%6]}"/><text class="cbt" x="${bx}" y="${by}" style="font-size:${tag>7?5:4.4}px">${m.opp}</text><title>${m.c==='liga'?'J':m.c==='ucl'?'UCL ':'Cup '}${m.rd} · ${m.opp} (${m.home?'H':'A'}) ${m.gf}–${m.ga}</title></g>`;
 });
 return s;
}
function drawFans(){
 $('#fans').innerHTML=
  `<g opacity=".5"><circle cx="150" cy="455" r="74" fill="none" stroke="#d9d4cc"/><circle cx="1150" cy="360" r="74" fill="none" stroke="#d9d4cc"/></g>`+
  fan(V.left,150,455,70,214,-102,18,'r1','ex1',0,7.6,2.1)+fan(V.right,1150,360,70,210,105,255,'r2','ex2',2,7.2,1.85);
}
/* ===== mini chart ===== */
function drawMini(){
 const W=300,H=131,pl=14,pr=4,pt=12,pb=12,mx=Math.max(4,...V.monthly.map(m=>Math.max(m.f,m.a)));
 const gw=(W-pl-pr)/10,bw=Math.min(10,gw/2-1.2),Y=v=>pt+(H-pt-pb)*(1-v/mx);let s='';
 [0,Math.round(mx/2),mx].forEach(g=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(g)}" y2="${Y(g)}" stroke="#d6d1c9" stroke-width=".6"/><text x="${pl-3}" y="${Y(g)+2.4}" text-anchor="end" font-size="6" font-weight="700" fill="#8a867e">${g}</text>`});
 V.monthly.forEach((m,i)=>{
  const x=pl+gw*i+gw/2,on=mon<0||mon===i,op=on?1:.3;
  s+=`<rect x="${x-bw-.5}" y="${Y(m.f)}" width="${bw}" height="${Y(0)-Y(m.f)}" rx="1.5" fill="#234a8a" opacity="${op}"/><rect x="${x+.5}" y="${Y(m.a)}" width="${bw}" height="${Y(0)-Y(m.a)}" rx="1.5" fill="#a63a4e" opacity="${op}"/>`;
  s+=`<text x="${x}" y="${H-2}" text-anchor="middle" font-size="6.4" font-weight="700" fill="${mon===i?'#a63a4e':'#8a867e'}">${MON[lang][i]}</text>`;
  const ball=(cx,v,c)=>v>0?`<circle cx="${cx}" cy="${Y(v)}" r="5" fill="${c}" stroke="#fff" stroke-width="1" opacity="${op}"/><text x="${cx}" y="${Y(v)+.2}" text-anchor="middle" dominant-baseline="central" font-size="${v>9?4.6:5.4}" font-weight="800" fill="#fff" opacity="${op}">${v}</text>`:'';
  s+=ball(x-bw/2-.5,m.f,'#234a8a')+ball(x+bw/2+.5,m.a,'#a63a4e');
 });
 $('#mcs').innerHTML=s;
 $('#mcp').textContent=sLab(season)+(comp==='all'?'':' · '+CPN[lang][comp]);
 const R=V.rows,f=(l,v)=>`<span><i>${l}</i>${v}</span>`;
 const dflt=(season===2025&&comp==='all'&&mon<0);
 $('#chips').innerHTML=f('J',R.length)+f('V',V.VV)+f('E',V.EE)+f('D',V.DD)+f('Pts',V.VV*3+V.EE)+`<em><b><s style="background:#234a8a"></s>${T[lang].mf}</b><b><s style="background:#a63a4e"></s>${T[lang].ma}</b></em>`;
 $('#clr').textContent=T[lang].clr;$('#clr').classList.toggle('show',!dflt);
}
/* ===== silhouette ===== */
function sil(el,v,lbl,small){
 const dk='#3b3f4a',c1='#c9a04a',c2='#a63a4e',c3='#2f7f86';
 const fy=small?98:112;
 const g=`<g transform="translate(${small?4:6},${small?-4:0})" stroke="${dk}" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <circle cx="44" cy="${small?14:16}" r="${small?7.5:8.5}" fill="${dk}" stroke="none"/>
  <path d="M36 27L52 27L50 62L38 62Z" fill="${dk}" stroke-width="5"/>
  <path d="M38 31L24 46L28 58" stroke-width="5.5"/><path d="M52 31L66 42L63 55" stroke-width="5.5"/>
  <path d="M42 62L40 86L33 ${fy}" stroke-width="8.5"/><path d="M33 ${fy}L25 ${fy}" stroke-width="5"/>
  <path d="M50 62L68 78L86 ${small?86:94}" stroke-width="8.5"/></g>`;
 const ball=`<circle cx="${small?100:104}" cy="${small?88:96}" r="5.5" fill="#fff" stroke="${dk}" stroke-width="1.6"/>`;
 const mk=(x,y,c)=>`<circle cx="${x}" cy="${y}" r="4.8" fill="${c}" stroke="#fff" stroke-width="1.6"/>`;
 const num=(x,y,n,c,l1)=>`<text x="${x}" y="${y}" font-family="Oswald,Arial Narrow,sans-serif" font-weight="700" font-size="${small?15:17}" fill="${c}">${n}</text><text x="${x}" y="${y+8}" font-size="6.4" font-weight="700" fill="#6b6861">${l1}</text>`;
 el.innerHTML=g+ball+mk(small?58:62,small?4:7,c1)+mk(small?35:36,fy-1,c3)+mk(small?88:90,small?87:95,c2)+
  num(small?80:76,small?9:11,v.h,c1,lbl.h)+num(small?46:50,small?90:120,v.r,c3,lbl.r)+num(small?100:84,small?56:70,v.l,c2,lbl.l);
}
function pctBar(blEl,barEl,v){
 const t=v.h+v.r+v.l||1,pl=Math.round(v.l/t*1000)/10,pr=Math.round(v.r/t*1000)/10,ph=Math.round((100-pl-pr)*10)/10,z=v.h+v.r+v.l===0;
 barEl.innerHTML=z?'':`<span style="width:${pl}%;background:#a63a4e"></span><span style="width:${pr}%;background:#2f7f86"></span><span style="width:${ph}%;background:#c9a04a"></span>`;
 blEl.innerHTML=z?'<span>–</span>':`<span style="color:#a63a4e">${pl}%</span><span style="color:#2f7f86">${pr}%</span><span style="color:#c9a04a">${ph}%</span>`;
}
function cnt(el,val,dec){el.textContent=dec?(+val).toFixed(dec):fmt(val)}
/* ===== text & render ===== */
function buildFilters(){
 $('#se').innerHTML=SEASONS.map(s=>`<button class="pl se${s===season?' on':''}" data-s="${s}">${sLab(s)}</button>`).join('');
 $('#cp').innerHTML=COMPS.map(c=>`<button class="pl cp${c===comp?' on':''}" data-c="${c}">${CPN[lang][c]}</button>`).join('');
 $('#mo').innerHTML=`<button class="pl${mon<0?' on':''}" data-m="-1" style="flex:1.5">${T[lang].all}</button>`+MON[lang].map((m,i)=>`<button class="pl${mon===i?' on':''}" data-m="${i}">${m}</button>`).join('');
}
function applyLang(){
 const t=T[lang];document.documentElement.lang=lang;
 $$('[data-i]').forEach(e=>{const v=t[e.dataset.i];if(typeof v==='string')e.textContent=v});
 $$('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 buildFilters();if(V)texts();
}
function texts(){
 const t=T[lang],n0=PL[V.top[0][0]][0],g0=V.top[0][1];
 $('#kk').textContent=t.kick+' '+sLab(season);
 $('#sub').textContent=!V.rows.length?t.none:(V.GF>V.pm?t.rec:t.gap(V.pm-V.GF));
 $('#ld').innerHTML=V.rows.length?t.ld(V.rows.length,V.GF,V.VV,V.EE,V.DD,V.GA,n0,g0):'';
 $('#srp').innerHTML=t.sr(V.sB.l,V.sB.r,V.sB.h);$('#slp').innerHTML=t.sl(V.sA.l,V.sA.r,V.sA.h);
 const lb={l:t.chL,r:t.chR,h:t.chH};sil($('#srs'),V.sB,lb);sil($('#sls'),V.sA,lb,true);
 V.prev.forEach((p,i)=>$('#pn'+i).textContent=t.ep+' '+sLab(p.s));
 $('#pcn').innerHTML=t.act+'<br>'+sLab(season);
 V.top.forEach((x,i)=>$('#rn'+i).textContent=PL[x[0]][0]);
 $('#rk2').innerHTML=t.rk2(V.GF?Math.round(g0/V.GF*100):0);
 drawMini();if($('#tbl').classList.contains('on'))sheet();
}
function render(){
 V=compute();drawFans();
 cnt($('#b1 b'),V.gA);cnt($('#b2 b'),V.gB);
 cnt($('#g1 b'),V.ast);cnt($('#g2 b'),V.rows.length);$('#g3 b').textContent=V.rows.length?(V.GF/V.rows.length).toFixed(2):'0.00';cnt($('#g4 b'),V.pens);
 cnt($('#g5 b'),V.sh);$('#g6 b').textContent=V.poss;cnt($('#g7 b'),V.GA);cnt($('#g8 b'),V.cs);
 pctBar($('#srbl'),$('#srb'),V.sB);pctBar($('#slbl'),$('#slb'),V.sA);
 V.prev.forEach((p,i)=>cnt($('#pv'+i),p.v));cnt($('#pcv'),V.GF);
 V.top.forEach((x,i)=>cnt($('#rv'+i),x[1]));cnt($('#rkc'),V.GF);
 texts();
}
/* ===== Excel sheet ===== */
function sheetRows(){
 let r=V.rows.map(m=>({m,v:[sLab(m.s),CPN[lang][m.c],MON[lang][m.m],m.opp,m.home?'H':'A',m.gf,m.ga,m.gf+'–'+m.ga,m.sh,m.poss,m.goals.filter(g=>g.a>=0).length]}));
 if(sortK!==null)r.sort((a,b)=>(a.v[sortK]>b.v[sortK]?1:a.v[sortK]<b.v[sortK]?-1:0)*sortD);
 return r;
}
function sheet(){
 const t=T[lang],rs=sheetRows(),L='ABCDEFGHIJK';
 $('#shT').textContent='⚽ '+t.tT+' · '+sLab(season);$('#shX').textContent=t.tX;$('#shC').textContent=t.tC;
 $('#shF').innerHTML=`<span>${t.tf}:</span><span>${t.fy} ${sLab(season)}</span><span>${t.fc} ${CPN[lang][comp]}</span><span>${t.fm} ${mon<0?t.all:MON[lang][mon]}</span><span>${rs.length} ${t.tn}</span>`;
 const head=`<tr class="ab"><th></th>${[...L].map(c=>`<th>${c}</th>`).join('')}</tr><tr class="hd"><th></th>${t.cols.map((c,i)=>`<th data-k="${i}">${c}${sortK===i?(sortD>0?' ▲':' ▼'):''}</th>`).join('')}</tr>`;
 const body=rs.map((x,i)=>`<tr class="${x.m.gf>x.m.ga?'w':x.m.gf<x.m.ga?'l':'d'}"><td class="rn">${i+1}</td>${x.v.map((c,j)=>`<td class="${j>=5&&j!==7?'n':''}${j===7?' res':''}">${c}</td>`).join('')}</tr>`).join('');
 const n=rs.length,sm=i=>rs.reduce((a,x)=>a+x.v[i],0);
 const foot=`<tr><td class="rn">Σ</td><td colspan="4">${t.tot}</td><td></td><td class="n">${sm(5)}</td><td class="n">${sm(6)}</td><td></td><td class="n">${sm(8)}</td><td class="n">${n?Math.round(sm(9)/n):0}</td><td class="n">${sm(10)}</td></tr>`;
 $('#shTab').innerHTML=`<thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot>`;
}
function exportCsv(){
 const t=T[lang],rs=sheetRows(),q=v=>`"${String(v).replace(/"/g,'""')}"`;
 const csv='﻿'+[t.cols.map(q).join(';'),...rs.map(x=>x.v.map(q).join(';'))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`jogos_${sLab(season).replace('/','-')}.csv`;a.click();
}
/* ===== events ===== */
document.addEventListener('click',e=>{
 const s=e.target.closest('[data-s]'),c=e.target.closest('[data-c]'),m=e.target.closest('[data-m]'),l=e.target.closest('#langs [data-l]');
 if(s){season=+s.dataset.s;buildFilters();render()}
 else if(c){comp=c.dataset.c;buildFilters();render()}
 else if(m){mon=+m.dataset.m;buildFilters();render()}
 else if(l){lang=l.dataset.l;applyLang()}
 else if(e.target.closest('#clr')){season=2025;comp='all';mon=-1;buildFilters();render()}
 else if(e.target.closest('#rf')){seed=Math.floor(Math.random()*1e6)+1;buildDB();render()}
 else if(e.target.closest('#tb')){$('#tbl').classList.add('on');sheet()}
 else if(e.target.closest('#shC')||e.target.id==='tbl'){$('#tbl').classList.remove('on')}
 else if(e.target.closest('#shX')){exportCsv()}
 else if(e.target.closest('#shTab th[data-k]')){const k=+e.target.closest('th').dataset.k;if(sortK===k)sortD=-sortD;else{sortK=k;sortD=1}sheet()}
});
addEventListener('keydown',e=>{if(e.key==='F9'){e.preventDefault();seed=Math.floor(Math.random()*1e6)+1;buildDB();render()}if(e.key==='Escape')$('#tbl').classList.remove('on')});
$$('.slot,#hero').forEach(s=>{const im=s.querySelector('img');if(im&&im.getAttribute('src'))s.classList.add('has')});
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);$('#stage').style.transform=`translate(${(innerWidth-1280*s)/2}px,${(innerHeight-720*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
buildDB();applyLang();render();
</script>
</body>
